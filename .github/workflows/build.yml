name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - run: |
          curl -fsSL https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64 -o "$RUNNER_TEMP/nimby"
          chmod +x "$RUNNER_TEMP/nimby"
          "$RUNNER_TEMP/nimby" sync nimby.lock -g
      - run: nim check src/planet_wars.nim
      - run: nim r tests/tests.nim
      - run: nim r --path:src training/test_bridge.nim
      - run: nim c --path:src -o:$RUNNER_TEMP/planet-training-bridge training/bridge.nim
      - run: python -m training.smoke "$RUNNER_TEMP/planet-training-bridge"
      - run: python -m pip install numpy==2.3.3
      - run: nim c --threads:on -o:$RUNNER_TEMP/planet-wars-server src/planet_wars.nim
      - run: nim c --path:src -o:$RUNNER_TEMP/planet-wars-skurge players/skurge/skurge.nim
      - run: python -m training.docker_smoke --server "$RUNNER_TEMP/planet-wars-server" --skurge "$RUNNER_TEMP/planet-wars-skurge" --output "$RUNNER_TEMP/planet-wars-smoke"
      - run: nim r --path:src training/check_replay.nim "$RUNNER_TEMP/planet-wars-smoke/replay.bitreplay"
